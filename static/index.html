<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>PartsBridge PK</title>
<link rel="stylesheet" href="/static/app.css?v=8">
<script src="/static/app.js?v=8" defer></script>
</head>
<body>
<header><h1>PartsBridge PK</h1><p>Find any car part: local dealers first, then worldwide with shipping and Pakistan customs.</p></header>
<main>
<form id="f" autocomplete="on">
  <label class="switch"><input type="checkbox" name="local_only" role="switch" checked><span class="track" aria-hidden="true"></span>
    <span><b>Pakistan sellers only</b><span class="mute"> · Pakistani parts websites, Daraz, PakWheels, OLX and Facebook / Instagram shops. Turn off to also compare imports from 12 countries with shipping and customs.</span></span></label>
  <label>Make<input name="make" placeholder="e.g. Toyota" maxlength="40" required></label>
  <label>Model<input name="model" placeholder="e.g. Corolla" maxlength="60" required></label>
  <label>Year<input name="year" type="number" min="1950" max="2030" placeholder="e.g. 2017"></label>
  <label>Part<input name="part_name" placeholder="e.g. air filter" minlength="2" maxlength="100" required></label>
  <label>OEM part no. (optional)<input name="oem_number" maxlength="40" placeholder="if you know it"></label>
  <label>Your city<select name="customer_city"><option>Karachi</option><option selected>Lahore</option><option>Islamabad</option><option>Rawalpindi</option><option>Peshawar</option><option>Faisalabad</option><option>Multan</option><option>Quetta</option></select></label>
  <label>Min vendor rating<select name="min_vendor_rating"><option value="0">Any</option><option value="4">4.0+</option><option value="4.5">4.5+</option></select></label>
  <label class="chk"><input type="checkbox" name="is_tax_filer" checked> FBR active tax filer</label>
  <label class="chk"><input type="checkbox" name="c_new" checked> New</label>
  <label class="chk"><input type="checkbox" name="c_used" checked> Used</label>
  <label class="chk"><input type="checkbox" name="c_refurbished" checked> Refurbished</label>
  <label class="chk"><input type="checkbox" name="oem_only"> Genuine OEM only</label>
  <button id="go" type="submit">Search</button>
</form>

<div class="examples" id="examples">
  <span class="mute">Try:</span>
  <button type="button" class="ex" data-q='{"make":"Toyota","model":"Corolla","year":2017,"part_name":"air filter"}'>Toyota Corolla 2017 air filter</button>
  <button type="button" class="ex" data-q='{"make":"Honda","model":"Civic","year":2018,"part_name":"brake pads"}'>Honda Civic 2018 brake pads</button>
  <button type="button" class="ex" data-q='{"make":"Suzuki","model":"Alto","year":2020,"part_name":"headlight"}'>Suzuki Alto 2020 headlight</button>
</div>

<section id="live" class="live" hidden aria-live="polite">
  <div class="live-head">
    <span class="pulse" aria-hidden="true"></span>
    <b id="live-title">Researching</b>
    <span class="live-clock" id="live-clock">0:00</span>
  </div>
  <ol class="live-log" id="live-log"></ol>
  <div class="live-now"><span class="ico" id="live-ico" aria-hidden="true"></span><span id="live-now"></span><span class="caret" aria-hidden="true"></span></div>
  <div class="live-stats" id="live-stats"></div>
  <p class="live-tip" id="live-tip">Deep research across 12 countries takes 1–2 minutes. Keep this tab open; results appear here as soon as they're verified.</p>
</section>

<div class="tabs" id="tabs" hidden>
  <button type="button" data-s="cheapest" class="on">Cheapest</button><button type="button" data-s="best_value">Best value</button>
  <button type="button" data-s="top_rated">Top rated</button><button type="button" data-s="fastest">Fastest</button>
</div>
<div id="out"></div>
</main>
</body>
</html>
