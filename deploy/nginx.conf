# PartsBridge PK - nginx in front of uvicorn. __SERVER_NAME__ is replaced by install.sh.
# Security headers (CSP, nosniff, frame-ancestors...) are set by the app itself, so they are not repeated here.
limit_req_zone $binary_remote_addr zone=pb_search:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=pb_events:10m rate=120r/m;

# If this nginx sits behind another reverse proxy (e.g. a Caddy container), trust its X-Forwarded-For so
# rate limits stay per visitor. Adjust to your proxy's address; harmless when nginx is the public front.
# set_real_ip_from 172.18.0.0/16;
# real_ip_header X-Forwarded-For;

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    client_max_body_size 64k;

    # Live research feed: Server-Sent Events, so nothing may be buffered.
    location = /api/search/stream {
        limit_req zone=pb_search burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    # The page and its assets straight from disk (deploy copies app/static to /var/www/partsbridge/static).
    # Under load the app's single event loop is busy with searches; nginx serves these in microseconds.
    # Same security headers as the app sends (app/main.py CSP).
    set $pb_csp "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'";
    location /static/ {
        alias /var/www/partsbridge/static/;
        expires 7d;                                   # every asset URL carries ?v=N, so a deploy busts the cache
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy $pb_csp always;
        gzip on;
        gzip_types text/css application/javascript application/json;
    }
    location = / {
        root /var/www/partsbridge/static;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy $pb_csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
    }

    # Umami analytics (self-hosted, docker compose in ~/umami, 127.0.0.1:3001). Served from this origin so the
    # strict CSP ('self') needs no exception and the tracker is not mistaken for a third-party tracker.
    location = /u.js {
        proxy_pass http://127.0.0.1:3001/u.js;
        proxy_set_header Host $host;
        expires 1h;
    }
    location = /api/send {
        limit_req zone=pb_events burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:3001/api/send;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/search {
        limit_req zone=pb_search burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;      # deep web search takes 1-2.5 minutes
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
