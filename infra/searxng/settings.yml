# SearXNG override for PartsBridge PK. Keeps upstream defaults, enables the JSON API our backend calls.
use_default_settings: true
general:
  instance_name: "partsbridge-search"
search:
  safe_search: 0
  formats:
    - html
    - json
server:
  port: 8888
  bind_address: "127.0.0.1"   # local only; never expose publicly
  limiter: false
  secret_key: "change-me-via-SEARXNG_SECRET"
  image_proxy: false
outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
# Upstream defaults enable only duckduckgo + google cse for general web search; from a cloud IP both get
# CAPTCHA'd / suspended under load, which left whole countries with zero results. Enable the free engines that
# answer from this server (tested 2026-11-25: bing, brave, yahoo, naver, yandex OK; google/qwant access denied,
# baidu parsing error). More engines = more distinct shops per query and no single point of failure.
engines:
  - name: bing
    disabled: false
  - name: brave
    disabled: false
  - name: yahoo
    disabled: false
  - name: naver          # Korean market
    disabled: false
  - name: yandex         # Turkey / CIS sellers
    disabled: false
  - name: mwmbl
    disabled: false
